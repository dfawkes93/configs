[main]
include=~/.config/fuzzel/fuzzel.ini

# Used by bin/scripts/bw-sel — it branches on fuzzel's exit code
# (custom-N exits with 9+N).
[key-bindings]
delete-line-backward=none
execute-input=none
# 17: copy username
custom-8=Control+u Shift+Return
# 18: copy TOTP code
custom-9=Control+t
# 19: type password
custom-10=Mod1+Return
